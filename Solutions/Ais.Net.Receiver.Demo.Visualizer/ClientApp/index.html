<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIS Vessel Movement Visualization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }

    /* Time display - top right */
    #time-display {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    /* Vessel count - bottom right */
    #vessel-count {
      position: absolute;
      bottom: 80px;
      right: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #aaa;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    #vessel-count span { color: #fff; font-weight: 600; }

    /* Playback controls - bottom center */
    #controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
      backdrop-filter: blur(8px);
      font-size: 13px;
    }
    #controls button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    #controls button:hover { background: rgba(255, 255, 255, 0.2); }
    #controls button.active { background: rgba(100, 200, 255, 0.3); border-color: rgba(100, 200, 255, 0.5); }
    #time-slider {
      width: 300px;
      accent-color: #4af;
      cursor: pointer;
    }
    #speed-display { min-width: 40px; text-align: center; color: #aaa; }

    /* Layer toggles */
    #layer-toggles {
      display: flex;
      gap: 8px;
      margin-left: 8px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.15);
    }
    #layer-toggles label {
      cursor: pointer;
      color: #999;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    #layer-toggles input:checked + span { color: #fff; }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      background: #0a0a1a;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      z-index: 100;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="loading">Loading vessel data...</div>

  <div id="time-display">--</div>
  <div id="vessel-count">Active vessels: <span id="active-count">0</span></div>

  <div id="controls">
    <button id="btn-play" title="Play/Pause (Space)">Play</button>
    <input type="range" id="time-slider" min="0" max="1000" value="0" />
    <button id="btn-slower" title="Slower (-)">-</button>
    <span id="speed-display">10x</span>
    <button id="btn-faster" title="Faster (+)">+</button>
    <div id="layer-toggles">
      <label><input type="checkbox" id="tog-tracks" checked /><span>Tracks</span></label>
      <label><input type="checkbox" id="tog-trails" checked /><span>Trails</span></label>
      <label><input type="checkbox" id="tog-dots" checked /><span>Dots</span></label>
      <label><input type="checkbox" id="tog-labels" checked /><span>Labels</span></label>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
