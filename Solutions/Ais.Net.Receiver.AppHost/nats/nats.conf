# NATS configuration for the local AIS Visualizer demo.
#
# The websocket listener exists because the visualiser page subscribes to vessel positions directly
# from the browser (nats.ws) rather than proxying them through the ASP.NET Core host. nats-server has
# no command-line flag for websockets - it is configuration-file only - which is why this file exists
# at all rather than being expressed as container arguments in the AppHost.

# Standard client listener, for the .NET publisher in the worker.
port: 4222

websocket {
  port: 8080

  # Plain ws:// on loopback. This is a local demo; anything shared needs TLS and credentials.
  no_tls: true
}
